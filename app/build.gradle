plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk buildVersions.compileSdkVersion
    buildToolsVersion buildVersions.buildToolsVersion

    defaultConfig {
        applicationId "ir.divar"
        minSdk buildVersions.minSdkVersion
        targetSdk buildVersions.targetSdkVersion
        versionCode 1
        versionName "1.0"

    }
    lintOptions {
        abortOnError false
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation project(':Referrer')
    implementation "androidx.core:core-ktx:${libraryVersions.corektx}"
    implementation "androidx.appcompat:appcompat:${libraryVersions.appcompat}"
    implementation "com.google.android.material:material:${libraryVersions.material}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${libraryVersions.coroutines}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${libraryVersions.lifecyclektx}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${libraryVersions.lifecyclektx}"
    implementation "androidx.constraintlayout:constraintlayout:${libraryVersions.constraintlayout}"
}